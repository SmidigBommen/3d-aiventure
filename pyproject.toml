[project]
name = "aiventure3d"
version = "0.1.0"
description = "AIVentures: The Shattered Crown, in first-person 3D"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "itsdangerous",
]

[dependency-groups]
dev = ["pytest", "httpx", "pillow"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
